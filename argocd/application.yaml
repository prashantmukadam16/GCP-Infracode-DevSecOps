apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: gcp-infracode-app
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/prashantmukadam16/GCP-Infracode-DevSecOps.git
    targetRevision: main
    path: kubernetes

  destination:
    server: https://kubernetes.default.svc
    namespace: devops-demo

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true